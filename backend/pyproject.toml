[project]
name = "graphmind-os-api"
version = "0.1.0"
description = "Graph-backed memory and agent coordination API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "falkordb>=1.0.0",
    "httpx>=0.27,<1",
    "pydantic>=2.8,<3",
    "python-dotenv>=1,<2",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "mypy>=1.18,<2",
    "pytest>=8,<10",
    "ruff>=0.13,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E9", "F"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
