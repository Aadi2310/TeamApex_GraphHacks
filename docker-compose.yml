services:
  falkordb:
    image: falkordb/falkordb:latest
    ports: ["6379:6379", "3000:3000"]
    volumes: ["falkordb_data:/var/lib/falkordb/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      falkordb: {condition: service_healthy}
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3001:3000"]
    depends_on: [backend]
volumes:
  falkordb_data:
